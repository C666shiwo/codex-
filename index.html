el><label class="field wide"><span>缺陷编号或链接</span><input data-draft="defect" value="${esc(c.defect)}"></label><label class="field wide"><span>证据链接</span><input data-draft="evidence" value="${esc(c.evidence)}" placeholder="脱敏截图、录屏或日志地址"></label><label class="field wide"><span>备注</span><textarea rows="3" data-draft="notes">${esc(c.notes)}</textarea></label></div></section></div><div class="drawer-foot"><span class="muted">版本 ${c.version||1} · ${time(c.updatedAt)}</span><div><button class="btn btn-ghost" data-action="close-drawer">取消</button><button class="btn btn-primary" data-action="save-case">保存用例</button></div></div></aside></div>`; }
      function metaView(){ const m=state.meta; return `<div class="modal-layer"><div class="modal"><div class="drawer-head"><div><div class="kicker">WORKBENCH SETUP</div><h2>编辑测试轮次</h2></div><button class="close" data-action="close-meta">×</button></div><div class="edit-form"><label class="field"><span>测试轮次</span><input data-meta="round" value="${esc(m.round)}"></label><label class="field"><span>测试环境</span><input data-meta="environment" value="${esc(m.environment)}"></label><label class="field"><span>新系统测试入口</span><input data-meta="newSystemUrl" value="${esc(m.newSystemUrl)}" placeholder="新系统地址，暂未提供可留空"></label><label class="field"><span>静态版本说明</span><input data-meta="legacySystemUrl" value="${esc(m.legacySystemUrl)}"></label><label class="field"><span>当前执行人</span><input data-meta="currentTester" value="${esc(m.currentTester||'陈弘洋')}"></label><label class="field"><span>功能验收结论</span><select data-meta="releaseDecision">${RELEASES.map(x=>`<option ${m.releaseDecision===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>遗留风险与上线说明</span><textarea rows="5" data-meta="releaseNotes">${esc(m.releaseNotes)}</textarea></label><div class="hint">这是公开静态版本，填写内容仅保存在当前浏览器，不会同步给其他人。需要团队共享、截图上传和 Excel 问题包时，请使用正式共享工作台。</div></div><div class="modal-foot"><button class="btn btn-ghost" data-action="close-meta">取消</button><button class="btn btn-primary" data-action="save-meta">保存</button></div></div></div>`; }

      function bind(){
        document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{view=el.dataset.view;state.sidebarOpen=false;notice='';render();}));
        document.querySelectorAll('[data-module]').forEach(el=>el.addEventListener('click',()=>{filter.module=el.dataset.module;view='cases';render();}));
        document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action)));
        document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{drawer=structuredClone(state.cases.find(c=>c.id===el.dataset.open));render();}));
        document.querySelectorAll('[data-quick-pass]').forEach(el=>el.addEventListener('click',()=>{let c=state.cases.find(c=>c.id===el.dataset.quickPass);if(c){c=structuredClone(c);c.status='通过';updateCase(c);notice=`${c.caseCode} 已标记为通过`;render();}}));
        const s=document.getElementById('search'); if(s)s.addEventListener('input',e=>{filter.search=e.target.value;render();});
        document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('change',()=>{filter[el.dataset.filter]=el.value;render();}));
        document.querySelectorAll('[data-draft]').forEach(el=>el.addEventListener('input',()=>{const key=el.dataset.draft; if(key==='blocking') drawer.blocking=el.checked; else drawer[key]=el.value;}));
        document.querySelectorAll('[data-step-text]').forEach(el=>el.addEventListener('input',()=>{const s=drawer.steps.find(x=>x.id===el.dataset.stepText);if(s)s.text=el.value;}));
        document.querySelectorAll('[data-step-done]').forEach(el=>el.addEventListener('change',()=>{const s=drawer.steps.find(x=>x.id===el.dataset.stepDone);if(s)s.done=el.checked;}));
        document.querySelectorAll('[data-remove-step]').forEach(el=>el.addEventListener('click',()=>{drawer.steps=drawer.steps.filter(s=>s.id!==el.dataset.removeStep);render();}));
        document.querySelectorAll('[data-move-step]').forEach(el=>el.addEventListener('click',()=>{const i=drawer.steps.findIndex(s=>s.id===el.dataset.moveStep);const to=i+Number(el.dataset.dir);if(i>=0&&to>=0&&to<drawer.steps.length)[drawer.steps[i],drawer.steps[to]]=[drawer.steps[to],drawer.steps[i]];render();}));
        document.querySelectorAll('[data-meta]').forEach(el=>el.addEventListener('input',()=>{state.meta[el.dataset.meta]=el.value;}));
      }
      function action(a){
        if(a==='menu'){state.sidebarOpen=!state.sidebarOpen;render();return}
        if(a==='clear-notice'){notice='';render();return}
        if(a==='reset'){filter={search:'',module:'',scope:'',type:'',priority:'',status:'',issueType:'',blocking:''};render();return}
        if(a==='refresh'){state=loadState();notice='已从本机草稿重新加载。';render();return}
        if(a==='new-system'){openExternal(state.meta.newSystemUrl);return}
        if(a==='legacy-system'){openExternal(state.meta.legacySystemUrl);return}
        if(a==='new-case'){const stamp=Date.now().toString(36);drawer={id:`custom-${stamp}`,roundId:state.meta.id,caseCode:`CUSTOM-${stamp.slice(-4).toUpperCase()}`,module:filter.module||MODULES[0],moduleOrder:1,feature:'',testType:'功能',priority:'P1',testScope:'待确认',title:'',preconditions:'',steps:[{id:`${stamp}-1`,text:'',done:false}],expectedResult:'',actualResult:'',retestResult:'',status:'未执行',tester:state.meta.currentTester||'陈弘洋',issueType:'其他',issueSummary:'',reproduction:'',impact:'',fixVersion:'',defect:'',evidence:'',notes:'',blocking:false,version:1,updatedAt:new Date().toISOString()};render();return}
        if(a==='close-drawer'){drawer=null;render();return}
        if(a==='add-step'){drawer.steps.push({id:`step-${Date.now().toString(36)}`,text:'',done:false});render();return}
        if(a==='save-case'){if(!drawer.title.trim())drawer.title=drawer.feature||'未命名测试用例';if(!state.cases.some(c=>c.id===drawer.id))state.cases.push(drawer);else updateCase(drawer);persist();notice=`${drawer.caseCode} 已保存`;drawer=null;render();return}
        if(a==='edit-meta'){metaEditing=true;render();return}
        if(a==='close-meta'){metaEditing=false;state=loadState();render();return}
        if(a==='save-meta'){state.meta.updatedAt=new Date().toISOString();state.meta.version=(state.meta.version||1)+1;persist();metaEditing=false;notice='测试轮次信息已保存到本机。';render();return}
        if(a==='new-round'){const source=state.cases;const now=new Date().toISOString();state={...structuredClone(initial),meta:{...structuredClone(initial.meta),id:`round-${Date.now()}`,round:'新系统测试轮次',currentTester:'陈弘洋',updatedAt:now},cases:source.map((c,i)=>({...structuredClone(c),id:`round-${Date.now()}-${i}`,roundId:`round-${Date.now()}`,status:'未执行',testScope:'待确认',tester:'陈弘洋',actualResult:'',retestResult:'',issueSummary:'',reproduction:'',impact:'',fixVersion:'',defect:'',evidence:'',notes:'',version:1,updatedAt:now,steps:c.steps.map(s=>({...s,done:false}))}))};persist();notice='已新建测试轮次，历史内容保存在此前导出的文件中。';render();return}
        if(a==='export'){exportFile();return}
      }
      function exportFile(){ const snapshot=JSON.stringify(state).replace(/</g,'\\u003c'); const closeScript='<'+'/script>'; const html=document.documentElement.outerHTML.replace(/<script id="embedded-state" type="application\/json">[\s\S]*?<\/script>/,'<script id="embedded-state" type="application/json">'+snapshot+closeScript); const blob=new Blob(['<!doctype html>\\n'+html],{type:'text/html;charset=utf-8'}); const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='HR系统功能测试工作台-可编辑版.html';a.click();URL.revokeObjectURL(url);notice='已导出当前编辑内容。';render(); }
      render();
    })();
  </script>
