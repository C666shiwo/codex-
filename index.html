<body>
  <div id="app"></div>
  <script id="embedded-state" type="application/json">__INITIAL_STATE__</script>
  <script>
    (() => {
      const KEY = 'hr-test-workbench-standalone-v1';
      const MODULES = ['登录与系统导航','用户管理','权限与角色基础能力','字典与基础配置','简历标签管理','邮件模板管理','职位管理','职位映射管理','简历库','候选人管理','面试与评估','Offer与入职','人才库','失败清单','数据分析'];
      const SEED_FEATURES = {
        '登录与系统导航':'账号登录与退出|主导航与模块入口|刷新、返回与分页状态',
        '用户管理':'用户列表加载|新增用户与必填校验|编辑、停用与恢复用户',
        '权限与角色基础能力':'角色列表与角色详情|菜单权限生效|无权限入口拦截',
        '字典与基础配置':'基础字典列表加载|新增与编辑字典项|停用字典项后的前台表现',
        '简历标签管理':'标签列表与筛选|新增标签与关键词|停用标签与重新识别',
        '邮件模板管理':'模板列表加载|新增、编辑与预览模板|变量缺失与发送失败提示',
        '职位管理':'职位列表加载|按岗位名称搜索|按部门查看岗位|新增岗位必填校验|新增岗位完整保存|编辑岗位|保存与发布状态区分|发布岗位|下架岗位|面试阶段配置|面试官配置|评估规则配置|岗位名称与后续映射一致性',
        '职位映射管理':'映射列表加载|新增映射|系统职位选择|BOSS职位名称填写|名称完全一致校验|映射保存、编辑与删除|映射后简历自动接收|未绑定邮箱时的异常提示',
        '简历库':'简历列表加载|姓名、来源、渠道筛选|手动导入|批量导入|支持格式校验|解析成功与解析失败|简历预览与编辑|简历投递|重复简历版本保留|简历标签识别与重新识别',
        '候选人管理':'岗位树加载|阶段统计加载|漏斗筛选|姓名、手机号、邮箱筛选|邮箱/手机号去重|候选人详情查看|投递岗位与当前阶段展示|阶段流转|终止投递|通过/不通过|Offer状态与候选人实际情况不一致处理|顶部统计与列表数量一致性',
        '面试与评估':'电话面、一面、二面、三面、终面配置|评估阶段展示|简历与作品集评估|作品集上传|新增面试|面试官选择|面试时间设置|会议室选择|会议室忙闲展示|日程创建|面评填写|通过/不通过|不通过原因|催面评|钉钉通知|AI听记联动',
        'Offer与入职':'Offer阶段展示|Offer发送|Offer接受与拒绝|待入职与已入职|Offer状态与候选人实际情况不一致处理',
        '人才库':'人才库独立页面|人工进入人才库|入库原因单选|其他原因文字补充|默认邀约岗位|编辑邀约岗位|候选人操作列邀约|批量邀约|邀约状态展示|邀约未响应保留|候选人接受后重新投递|邀约成功后移出人才库|入库通知5小时后触发|邀约投递邮件立即触发',
        '失败清单':'失败清单加载|失败状态与原因筛选|失败详情与原始简历查看|标记已处理|重试或人工处理',
        '数据分析':'数据分析页面加载|时间范围与岗位范围筛选|来源统计与招聘漏斗|渠道漏斗|统计数据与列表口径一致'
      };
      function makeSeed(){
        const now = new Date().toISOString();
        const meta = {id:'round-001',round:'重构上线首轮',environment:'新系统测试环境待补充',newSystemUrl:'',legacySystemUrl:'https://inc-test.91jzx.cn/dev-box-deploy/dev-88/#/',currentTester:'陈弘洋',releaseDecision:'待确认',releaseNotes:'',version:1,updatedAt:now};
        const cases=[]; let n=0;
        MODULES.forEach((module,moduleIndex)=>String(SEED_FEATURES[module]).split('|').forEach((feature,index)=>{
          n += 1; const critical=/登录|列表加载|岗位树加载|简历列表加载/.test(feature); const p=critical?'P00':(/新增|保存|发布|映射|导入|投递|阶段|面试|Offer|人才库|邀约|解析/.test(feature)?'P0':'P1');
          const blocking=critical || /发布|投递|阶段流转|终止|新增面试|日程创建|Offer发送|自动接收|重新投递|进入人才库/.test(feature);
          cases.push({id:`seed-${n}`,roundId:'round-001',caseCode:`${['SYS','USR','ROL','DIC','TAG','MAIL','POS','MAP','RES','CAN','INT','OFF','TAL','ERR','DAT'][moduleIndex]}-${String(index+1).padStart(3,'0')}`,module,moduleOrder:moduleIndex+1,feature,testType:critical?'冒烟':(/失败|异常|校验|不一致|未绑定/.test(feature)?'异常':'功能'),priority:p,testScope:'待确认',title:`${module}｜${feature}`,preconditions:'准备独立测试账号和脱敏测试数据；不影响老系统真实业务数据。',steps:[`进入系统对应模块，定位到“${feature}”。`,'按页面提示完成操作并记录关键页面状态。','保存截图、录屏或日志证据，填写实际结果。'].map((text,i)=>({id:`seed-${n}-${i}`,text,done:false})),expectedResult:`系统能够完成“${feature}”，页面提示、数据状态和后续链路符合需求。`,actualResult:'',retestResult:'',status:'未执行',tester:'陈弘洋',issueType:'其他',issueSummary:'',reproduction:'',impact:'',fixVersion:'',defect:'',evidence:'',notes:'',blocking,version:1,updatedAt:now});
        }));
        return {modules:MODULES,meta,cases};
      }
      const embedded = document.getElementById('embedded-state').textContent.trim();
      const initial = embedded === '__INITIAL_STATE__' ? makeSeed() : JSON.parse(embedded);
      const TEST_TYPES = ['冒烟','功能','异常','边界','回归','联调'];
      const PRIORITIES = ['P00','P0','P1','P2'];
      const STATUSES = ['未执行','通过','失败','阻塞','待复测'];
      const SCOPES = ['新系统新增功能','新系统原有功能回归','新旧系统对照','待确认'];
      const ISSUE_TYPES = ['页面展示','交互逻辑','数据处理','接口联调','权限控制','通知触发','状态流转','其他'];
      const RELEASES = ['待确认','可以上线','修复后再上线','有条件上线'];
      let state = loadState();
      let view = 'overview';
      let currentModule = '';
      let filter = { search:'', module:'', scope:'', type:'', priority:'', status:'', issueType:'', blocking:'' };
      let drawer = null;
      let metaEditing = false;
      let notice = '';

      function loadState(){ try { const saved = localStorage.getItem(KEY); return saved ? JSON.parse(saved) : structuredClone(initial); } catch { return structuredClone(initial); } }
      function persist(){ localStorage.setItem(KEY, JSON.stringify(state)); }
      function time(v){ if(!v) return '未记录'; return new Intl.DateTimeFormat('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v)); }
      function esc(v){ return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
      function nl(v){ return esc(v).replace(/\n/g,'<br>'); }
      function cls(v){ return String(v).toLowerCase().replace(/[^a-z0-9]/g,''); }
      function issueCases(){ return state.cases.filter(c => ['失败','阻塞','待复测'].includes(c.status) || c.issueSummary.trim()); }
      function unresolved(){ return issueCases().filter(c => c.status !== '通过'); }
      function passed(){ return state.cases.filter(c => c.status === '通过').length; }
      function executed(){ return state.cases.filter(c => c.status !== '未执行').length; }
      function passRate(){ return state.cases.length ? Math.round(passed()/state.cases.length*100) : 0; }
      function executionRate(){ return state.cases.length ? Math.round(executed()/state.cases.length*100) : 0; }
      function closureRate(){ const issues = issueCases(); return issues.length ? Math.round(issues.filter(c=>c.status==='通过').length/issues.length*100) : 100; }
      function coreReady(){ return state.cases.filter(c => (c.priority==='P00'||c.priority==='P0'||c.blocking) && c.status!=='通过').length === 0; }
      function canGoLive(){ return executed()===state.cases.length && coreReady() && unresolved().length===0 && state.meta.newSystemUrl && state.meta.releaseDecision==='可以上线'; }
      function setNotice(v){ notice=v; render(); }
      function updateCase(item){ const now = new Date().toISOString(); item.updatedAt=now; item.version=(item.version||1)+1; state.cases=state.cases.map(c=>c.id===item.id?item:c); persist(); }
      function openExternal(url){ if(url) window.open(url,'_blank','noopener,noreferrer'); }
      function badge(text, extra=''){ return `<span class="pill ${extra||cls(text)}">${esc(text)}</span>`; }

      function render(){
        const nav = [['overview','⌂','测试总览'],['cases','▤','测试用例'],['defects','!','问题与复测'],['release','✓','上线结论']];
        document.getElementById('app').innerHTML = `<div class="app">
          <aside class="sidebar ${state.sidebarOpen?'open':''}" id="sidebar"><div class="brand"><span class="brand-mark">HR</span><div><strong>HR系统</strong><small>重构上线测试工作台</small></div></div><div class="local-badge"><span class="pulse"></span>本机可编辑版 · 自动保存</div>
          <nav class="nav">${nav.map(n=>`<button class="${view===n[0]?'active':''}" data-view="${n[0]}"><i>${n[1]}</i><span>${n[2]}</span>${n[0]==='defects'&&unresolved().length?`<em>${unresolved().length}</em>`:''}</button>`).join('')}</nav>
          <div class="module-block"><div class="section-label"><span>模块覆盖</span><b>${new Set(state.cases.map(c=>c.module)).size}/${MODULES.length}</b></div>${MODULES.map(m=>`<button class="module-nav" data-module="${esc(m)}"><span>${esc(m)}</span><b>${state.cases.filter(c=>c.module===m).length}</b></button>`).join('')}</div>
          <div class="sidebar-foot">老系统：只读基线<br>当前执行人：${esc(state.meta.currentTester||'陈弘洋')}<br><button class="link" data-action="export">导出当前 HTML</button></div></aside>
          <section class="content"><header class="topbar"><button class="mobile-menu" data-action="menu">☰</button><div><div class="eyebrow">QUALITY GATE / 01</div><h1>功能测试工作台</h1></div><div class="top-actions"><span class="sync">● 本机已保存</span><select class="round-select" id="roundSelect"><option>${esc(state.meta.round)}</option></select><button class="btn btn-ghost" data-action="refresh">↻ 刷新</button><button class="btn btn-primary" data-action="new-case">＋ 新增用例</button><button class="btn btn-ghost" data-action="export">导出 HTML</button></div></header>
          ${notice?`<div class="notice"><span>i</span> ${esc(notice)} <button data-action="clear-notice">×</button></div>`:''}
          <div class="toolbar"><div class="search"><span>⌕</span><input id="search" value="${esc(filter.search)}" placeholder="搜索用例编号、功能点、问题摘要或执行人"></div><div class="toolbar-meta"><span>测试轮次：<b>${esc(state.meta.round)}</b></span><span>执行人：<b>${esc(state.meta.currentTester||'陈弘洋')}</b></span><button class="btn btn-small btn-ghost" ${state.meta.newSystemUrl?'':'disabled'} data-action="new-system">打开新系统</button><button class="btn btn-small btn-ghost" ${state.meta.legacySystemUrl?'':'disabled'} data-action="legacy-system">打开老系统</button></div></div>
          ${view==='overview'?overview():view==='cases'?casesView():view==='defects'?defectsView():releaseView()}</section>
          ${drawer?drawerView():''}${metaEditing?metaView():''}</div>`;
        bind();
      }

      function overview(){ const cards=[['用例总数',state.cases.length,'全部测试范围',''],['测试完整度',executionRate()+'%','已执行 / 总用例','amber'],['通过',passed(),'已验证','green'],['失败',state.cases.filter(c=>c.status==='失败').length,'需要修复','red'],['阻塞',state.cases.filter(c=>c.status==='阻塞').length,'影响推进','red'],['问题闭环度',closureRate()+'%','问题已复测通过',''],['未闭环问题',unresolved().length,'失败 / 阻塞 / 待复测','red'],['P00/P0未通过',state.cases.filter(c=>(c.priority==='P00'||c.priority==='P0')&&c.status!=='通过').length,'上线判断重点','red']]; return `<div class="page"><section class="hero"><div><div class="kicker">RELEASE READINESS</div><h2>上线前，把每条链路跑清楚。</h2><p>当前工作台用于记录新系统功能验证、原有功能回归和后续问题闭环。</p></div><div class="readiness"><div class="ring" style="--progress:${passRate()*3.6}deg"><strong>${passRate()}%</strong><small>当前通过率</small></div><div><span>上线建议</span><strong class="${canGoLive()?'success':'danger'}">${canGoLive()?'可以上线':'待确认'}</strong><small>以测试完整度、核心用例和问题闭环共同判断</small></div></div></section><section class="kpis">${cards.map(c=>`<div class="kpi ${c[3]}"><span>${c[0]}</span><strong>${c[1]}</strong><small>${c[2]}</small></div>`).join('')}</section><section class="panel"><div class="panel-head"><div><div class="kicker">TEST ROUND</div><h3>本轮测试信息</h3></div><div class="panel-actions"><button class="btn btn-ghost" data-action="edit-meta">编辑信息</button><button class="btn btn-primary" data-action="new-round">＋ 新建测试轮次</button></div></div><div class="meta-grid"><div><span>测试轮次</span><b>${esc(state.meta.round)}</b></div><div><span>测试环境</span><b>${esc(state.meta.environment)}</b></div><div><span>当前执行人</span><b>${esc(state.meta.currentTester||'陈弘洋')}</b></div><div><span>新系统入口</span>${state.meta.newSystemUrl?`<button class="link" data-action="new-system">打开入口 ↗</button>`:'<b class="muted">待补充</b>'}</div><div><span>老系统基线</span>${state.meta.legacySystemUrl?`<button class="link" data-action="legacy-system">只读打开 ↗</button>`:'<b class="muted">待补充</b>'}</div><div><span>数据原则</span><b>脱敏数据 + 独立测试账号</b></div></div></section><section class="panel"><div class="panel-head"><div><div class="kicker">TEST GATE</div><h3>固定测试流程</h3></div><button class="link" data-view="cases">进入用例 →</button></div><div class="flow">${['确认改动','新功能验证','回归原功能','缺陷修复','复测确认','输出结果','上线判断'].map((x,i)=>`<div><span>${String(i+1).padStart(2,'0')}</span><b>${x}</b></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><div class="kicker">COVERAGE MAP</div><h3>模块覆盖</h3></div><button class="link" data-view="cases">查看全部用例 →</button></div><div class="coverage">${MODULES.map(m=>`<div><span>${esc(m)}</span><b>${state.cases.filter(c=>c.module===m).length}</b></div>`).join('')}</div></section></div>`; }

      function filters(){ return `<div class="filters"><select data-filter="module"><option value="">全部模块</option>${MODULES.map(m=>`<option ${filter.module===m?'selected':''}>${esc(m)}</option>`).join('')}</select><select data-filter="scope"><option value="">测试对象</option>${SCOPES.map(x=>`<option ${filter.scope===x?'selected':''}>${x}</option>`).join('')}</select><select data-filter="type"><option value="">测试类型</option>${TEST_TYPES.map(x=>`<option ${filter.type===x?'selected':''}>${x}</option>`).join('')}</select><select data-filter="priority"><option value="">优先级</option>${PRIORITIES.map(x=>`<option ${filter.priority===x?'selected':''}>${x}</option>`).join('')}</select><select data-filter="status"><option value="">测试状态</option>${STATUSES.map(x=>`<option ${filter.status===x?'selected':''}>${x}</option>`).join('')}</select><select data-filter="issueType"><option value="">问题类型</option>${ISSUE_TYPES.map(x=>`<option ${filter.issueType===x?'selected':''}>${x}</option>`).join('')}</select><select data-filter="blocking"><option value="">阻断上线</option><option value="yes" ${filter.blocking==='yes'?'selected':''}>是</option><option value="no" ${filter.blocking==='no'?'selected':''}>否</option></select><button class="btn btn-ghost" data-action="reset">重置</button></div>`; }
      function filtered(){ const q=filter.search.trim().toLowerCase(); return state.cases.filter(c=>(!q||[c.caseCode,c.title,c.feature,c.issueSummary,c.tester].join(' ').toLowerCase().includes(q))&&(!filter.module||c.module===filter.module)&&(!filter.scope||c.testScope===filter.scope)&&(!filter.type||c.testType===filter.type)&&(!filter.priority||c.priority===filter.priority)&&(!filter.status||c.status===filter.status)&&(!filter.issueType||c.issueType===filter.issueType)&&(!filter.blocking||(filter.blocking==='yes'?c.blocking:!c.blocking))); }
      function caseRows(items){ if(!items.length) return `<tr><td colspan="9"><div class="empty">没有匹配的测试用例</div></td></tr>`; return items.map(c=>`<tr><td><span class="case-code">${esc(c.caseCode)}</span><div class="case-title">${esc(c.title||c.feature)}</div></td><td><b>${esc(c.module)}</b><div class="muted">${esc(c.feature)}</div></td><td>${badge(c.testScope,'')}</td><td>${esc(c.testType)}</td><td>${badge(c.priority,cls(c.priority))}${c.blocking?'<div class="danger" style="font-size:11px;margin-top:5px">阻断上线</div>':''}</td><td>${badge(c.status, c.status==='通过'?'pass':c.status==='失败'?'fail':c.status==='阻塞'?'block':c.status==='待复测'?'retest':'')}</td><td>${esc(c.tester||'陈弘洋')}</td><td>${time(c.updatedAt)}</td><td><div class="table-actions"><button class="text-btn" data-open="${c.id}">详情</button>${c.status!=='通过'?`<button class="text-btn" data-quick-pass="${c.id}">通过</button>`:''}</div></td></tr>`).join(''); }
      function casesView(){ const items=filtered(); return `<div class="page"><section class="panel"><div class="panel-head"><div><div class="kicker">TEST CASES / ${state.cases.length}</div><h3>测试用例列表</h3><p>执行结果不预填，请在详情中补充实际结果、问题和证据。</p></div><button class="btn btn-primary" data-action="new-case">＋ 新增用例</button></div>${filters()}<div class="summary-row"><span>共 ${items.length} 条 · 目标覆盖 ${new Set(state.cases.map(c=>c.module)).size}/${MODULES.length} 个模块</span><span>未执行 ${state.cases.filter(c=>c.status==='未执行').length} · 通过 ${passed()} · 未闭环 ${unresolved().length}</span></div><div class="table-wrap"><table class="case-table"><thead><tr><th>用例</th><th>模块 / 功能点</th><th>测试对象</th><th>类型</th><th>优先级</th><th>状态</th><th>测试人员</th><th>更新时间</th><th>操作</th></tr></thead><tbody>${caseRows(items)}</tbody></table></div></section></div>`; }
      function defectsView(){ const items=issueCases().sort((a,b)=>{const order={P00:0,P0:1,P1:2,P2:3};return (order[a.priority]??9)-(order[b.priority]??9)}); return `<div class="page"><section class="panel"><div class="panel-head"><div><div class="kicker">ISSUES / ${items.length}</div><h3>问题与复测</h3><p>集中查看失败、阻塞、待复测和已填写问题摘要的用例。</p></div><span class="pill fail">未闭环 ${unresolved().length}</span></div><div class="issue-list">${items.length?items.map(c=>`<article class="issue-card"><div class="issue-top"><div><strong>${esc(c.caseCode)} · ${esc(c.title||c.feature)}</strong><div style="margin-top:7px">${badge(c.module)} ${badge(c.priority,cls(c.priority))} ${badge(c.status,c.status==='失败'?'fail':c.status==='阻塞'?'block':c.status==='待复测'?'retest':'')}</div></div><button class="text-btn" data-open="${c.id}">查看详情 →</button></div><p><b>问题摘要：</b>${c.issueSummary?nl(c.issueSummary):'<span class="muted">待补充</span>'}</p><p><b>复现条件：</b>${c.reproduction?nl(c.reproduction):'<span class="muted">待补充</span>'}</p><p><b>影响范围：</b>${c.impact?nl(c.impact):'<span class="muted">待补充</span>'}</p><p><b>缺陷记录：</b>${c.defect?esc(c.defect):'<span class="muted">待补充</span>'}　<b>修复版本：</b>${c.fixVersion?esc(c.fixVersion):'<span class="muted">待补充</span>'}</p></article>`).join(''):'<div class="empty">当前没有失败、阻塞或待复测记录。</div>'}</div></section></div>`; }
      function releaseView(){ const gates=[['全部用例已执行',executed()===state.cases.length],['P00/P0与阻断用例全部通过',coreReady()],['失败、阻塞和待复测问题已闭环',unresolved().length===0],['新系统测试入口已填写',Boolean(state.meta.newSystemUrl)],['上线结论和遗留风险已记录',state.meta.releaseDecision!=='待确认']]; return `<div class="page"><section class="release-hero"><div><div class="kicker">RELEASE DECISION</div><h2>上线结论</h2><p class="muted">测试完整度、核心用例和问题闭环共同决定上线结论。</p></div><div class="decision">${esc(state.meta.releaseDecision)}</div></section><section class="panel"><div class="panel-head"><div><h3>判断门禁</h3><p>不要只看通过率，要同时确认测试范围和问题闭环。</p></div><button class="btn btn-primary" data-action="edit-meta">编辑结论</button></div><div class="gate-list">${gates.map(g=>`<div class="gate ${g[1]?'ok':'no'}"><i>${g[1]?'✓':'!'}</i><span>${g[0]}</span></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h3>遗留风险与上线说明</h3></div><button class="btn btn-ghost" data-action="edit-meta">编辑</button></div><div style="padding:20px;line-height:1.8;color:#5f6a81">${state.meta.releaseNotes?nl(state.meta.releaseNotes):'尚未填写。请在测试完成后记录未关闭问题、上线条件、跟进人和处理时间。'}</div></section></div>`; }
      function drawerView(){ const c=drawer; return `<div class="drawer-layer" data-action="close-drawer"><aside class="drawer" onclick="event.stopPropagation()"><div class="drawer-head"><div><div class="kicker">CASE DETAIL</div><h2>${esc(c.caseCode||'新增测试用例')}</h2></div><button class="close" data-action="close-drawer">×</button></div><div class="drawer-body"><section class="drawer-section"><div class="form-grid"><label class="field"><span>用例标题</span><input data-draft="title" value="${esc(c.title)}"></label><label class="field"><span>模块</span><select data-draft="module">${MODULES.map(m=>`<option ${c.module===m?'selected':''}>${esc(m)}</option>`).join('')}</select></label><label class="field"><span>功能点</span><input data-draft="feature" value="${esc(c.feature)}"></label><label class="field"><span>测试类型</span><select data-draft="testType">${TEST_TYPES.map(x=>`<option ${c.testType===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>测试对象</span><select data-draft="testScope">${SCOPES.map(x=>`<option ${c.testScope===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>优先级</span><select data-draft="priority">${PRIORITIES.map(x=>`<option ${c.priority===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>测试状态</span><select data-draft="status">${STATUSES.map(x=>`<option ${c.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>测试人员</span><input data-draft="tester" value="${esc(c.tester||'陈弘洋')}"></label></div><label class="check-field" style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" data-draft="blocking" ${c.blocking?'checked':''}> <span>该用例阻断上线</span></label></section><section class="drawer-section"><h3>前置条件</h3><textarea style="width:100%;padding:10px" rows="3" data-draft="preconditions">${esc(c.preconditions)}</textarea></section><section class="drawer-section"><div class="panel-head" style="padding:0 0 12px;border:0"><h3>操作步骤</h3><button class="btn btn-small btn-ghost" data-action="add-step">＋ 新增步骤</button></div><div class="steps">${c.steps.map((s,i)=>`<div class="step"><span class="step-index">${i+1}</span><input type="checkbox" data-step-done="${s.id}" ${s.done?'checked':''}><input type="text" data-step-text="${s.id}" value="${esc(s.text)}"><button class="mini" data-move-step="${s.id}" data-dir="-1" ${i===0?'disabled':''}>↑</button><button class="mini" data-move-step="${s.id}" data-dir="1" ${i===c.steps.length-1?'disabled':''}>↓</button><button class="mini danger" data-remove-step="${s.id}">×</button></div>`).join('')}</div></section><section class="drawer-section"><h3>预期与实际</h3><div class="form-grid"><label class="field wide"><span>预期结果</span><textarea rows="4" data-draft="expectedResult">${esc(c.expectedResult)}</textarea></label><label class="field wide"><span>实际结果</span><textarea rows="4" data-draft="actualResult" placeholder="执行后填写">${esc(c.actualResult)}</textarea></label><label class="field wide"><span>复测结果</span><textarea rows="4" data-draft="retestResult" placeholder="修复后复测填写">${esc(c.retestResult)}</textarea></label></div></section><section class="drawer-section"><h3>问题记录</h3><div class="form-grid"><label class="field"><span>问题类型</span><select data-draft="issueType">${ISSUE_TYPES.map(x=>`<option ${c.issueType===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>修复版本</span><input data-draft="fixVersion" value="${esc(c.fixVersion)}" placeholder="例如 v2.1.0"></label><label class="field wide"><span>问题摘要</span><textarea rows="3" data-draft="issueSummary" placeholder="用一句话描述发现的问题">${esc(c.issueSummary)}</textarea></label><label class="field wide"><span>复现条件</span><textarea rows="3" data-draft="reproduction" placeholder="账号、数据、前置条件和复现步骤">${esc(c.reproduction)}</textarea></label><label class="field wide"><span>影响范围</span><textarea rows="3" data-draft="impact" placeholder="影响模块、用户和招聘流程">${esc(c.impact)}</textarea></label><label class="field wide"><span>缺陷编号或链接</span><input data-draft="defect" value="${esc(c.defect)}"></label><label class="field wide"><span>证据链接</span><input data-draft="evidence" value="${esc(c.evidence)}" placeholder="脱敏截图、录屏或日志地址"></label><label class="field wide"><span>备注</span><textarea rows="3" data-draft="notes">${esc(c.notes)}</textarea></label></div></section></div><div class="drawer-foot"><span class="muted">版本 ${c.version||1} · ${time(c.updatedAt)}</span><div><button class="btn btn-ghost" data-action="close-drawer">取消</button><button class="btn btn-primary" data-action="save-case">保存用例</button></div></div></aside></div>`; }
      function metaView(){ const m=state.meta; return `<div class="modal-layer"><div class="modal"><div class="drawer-head"><div><div class="kicker">WORKBENCH SETUP</div><h2>编辑测试轮次</h2></div><button class="close" data-action="close-meta">×</button></div><div class="edit-form"><label class="field"><span>测试轮次</span><input data-meta="round" value="${esc(m.round)}"></label><label class="field"><span>测试环境</span><input data-meta="environment" value="${esc(m.environment)}"></label><label class="field"><span>新系统测试入口</span><input data-meta="newSystemUrl" value="${esc(m.newSystemUrl)}" placeholder="新系统地址，暂未提供可留空"></label><label class="field"><span>老系统只读基线入口</span><input data-meta="legacySystemUrl" value="${esc(m.legacySystemUrl)}"></label><label class="field"><span>当前执行人</span><input data-meta="currentTester" value="${esc(m.currentTester||'陈弘洋')}"></label><label class="field"><span>上线结论</span><select data-meta="releaseDecision">${RELEASES.map(x=>`<option ${m.releaseDecision===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span>遗留风险与上线说明</span><textarea rows="5" data-meta="releaseNotes">${esc(m.releaseNotes)}</textarea></label><div class="hint">这是独立文件版本，修改后会保存在本机浏览器。导出 HTML 后，修改内容会写入新文件。</div></div><div class="modal-foot"><button class="btn btn-ghost" data-action="close-meta">取消</button><button class="btn btn-primary" data-action="save-meta">保存</button></div></div></div>`; }

      function bind(){
        document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>{view=el.dataset.view;state.sidebarOpen=false;notice='';render();}));
        document.querySelectorAll('[data-module]').forEach(el=>el.addEventListener('click',()=>{filter.module=el.dataset.module;view='cases';render();}));
        document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>action(el.dataset.action)));
        document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{drawer=structuredClone(state.cases.find(c=>c.id===el.dataset.open));render();}));
        document.querySelectorAll('[data-quick-pass]').forEach(el=>el.addEventListener('click',()=>{let c=state.cases.find(c=>c.id===el.dataset.quickPass);if(c){c=structuredClone(c);c.status='通过';updateCase(c);notice=`${c.caseCode} 已标记为通过`;render();}}));
        const s=document.getElementById('search'); if(s)s.addEventListener('input',e=>{filter.search=e.target.value;render();});
        document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('change',()=>{filter[el.dataset.filter]=el.value;render();}));
        document.querySelectorAll('[data-draft]').forEach(el=>el.addEventListener('input',()=>{const key=el.dataset.draft; if(key==='blocking') drawer.blocking=el.checked; else drawer[key]=el.value;}));
        document.querySelectorAll('[data-step-text]').forEach(el=>el.addEventListener('input',()=>{const s=drawer.steps.find(x=>x.id===el.dataset.stepText);if(s)s.text=el.value;}));
        document.querySelectorAll('[data-step-done]').forEach(el=>el.addEventListener('change',()=>{const s=drawer.steps.find(x=>x.id===el.dataset.stepDone);if(s)s.done=el.checked;}));
        document.querySelectorAll('[data-remove-step]').forEach(el=>el.addEventListener('click',()=>{drawer.steps=drawer.steps.filter(s=>s.id!==el.dataset.removeStep);render();}));
        document.querySelectorAll('[data-move-step]').forEach(el=>el.addEventListener('click',()=>{const i=drawer.steps.findIndex(s=>s.id===el.dataset.moveStep);const to=i+Number(el.dataset.dir);if(i>=0&&to>=0&&to<drawer.steps.length)[drawer.steps[i],drawer.steps[to]]=[drawer.steps[to],drawer.steps[i]];render();}));
        document.querySelectorAll('[data-meta]').forEach(el=>el.addEventListener('input',()=>{state.meta[el.dataset.meta]=el.value;}));
      }
      function action(a){
        if(a==='menu'){state.sidebarOpen=!state.sidebarOpen;render();return}
        if(a==='clear-notice'){notice='';render();return}
        if(a==='reset'){filter={search:'',module:'',scope:'',type:'',priority:'',status:'',issueType:'',blocking:''};render();return}
        if(a==='refresh'){state=loadState();notice='已从本机草稿重新加载。';render();return}
        if(a==='new-system'){openExternal(state.meta.newSystemUrl);return}
        if(a==='legacy-system'){openExternal(state.meta.legacySystemUrl);return}
        if(a==='new-case'){const stamp=Date.now().toString(36);drawer={id:`custom-${stamp}`,roundId:state.meta.id,caseCode:`CUSTOM-${stamp.slice(-4).toUpperCase()}`,module:filter.module||MODULES[0],moduleOrder:1,feature:'',testType:'功能',priority:'P1',testScope:'待确认',title:'',preconditions:'',steps:[{id:`${stamp}-1`,text:'',done:false}],expectedResult:'',actualResult:'',retestResult:'',status:'未执行',tester:state.meta.currentTester||'陈弘洋',issueType:'其他',issueSummary:'',reproduction:'',impact:'',fixVersion:'',defect:'',evidence:'',notes:'',blocking:false,version:1,updatedAt:new Date().toISOString()};render();return}
        if(a==='close-drawer'){drawer=null;render();return}
        if(a==='add-step'){drawer.steps.push({id:`step-${Date.now().toString(36)}`,text:'',done:false});render();return}
        if(a==='save-case'){if(!drawer.title.trim())drawer.title=drawer.feature||'未命名测试用例';if(!state.cases.some(c=>c.id===drawer.id))state.cases.push(drawer);else updateCase(drawer);persist();notice=`${drawer.caseCode} 已保存`;drawer=null;render();return}
        if(a==='edit-meta'){metaEditing=true;render();return}
        if(a==='close-meta'){metaEditing=false;state=loadState();render();return}
        if(a==='save-meta'){state.meta.updatedAt=new Date().toISOString();state.meta.version=(state.meta.version||1)+1;persist();metaEditing=false;notice='测试轮次信息已保存到本机。';render();return}
        if(a==='new-round'){const source=state.cases;const now=new Date().toISOString();state={...structuredClone(initial),meta:{...structuredClone(initial.meta),id:`round-${Date.now()}`,round:'新系统测试轮次',currentTester:'陈弘洋',updatedAt:now},cases:source.map((c,i)=>({...structuredClone(c),id:`round-${Date.now()}-${i}`,roundId:`round-${Date.now()}`,status:'未执行',testScope:'待确认',tester:'陈弘洋',actualResult:'',retestResult:'',issueSummary:'',reproduction:'',impact:'',fixVersion:'',defect:'',evidence:'',notes:'',version:1,updatedAt:now,steps:c.steps.map(s=>({...s,done:false}))}))};persist();notice='已新建测试轮次，历史内容保存在此前导出的文件中。';render();return}
        if(a==='export'){exportFile();return}
      }
      function exportFile(){ const snapshot=JSON.stringify(state).replace(/</g,'\\u003c'); const closeScript='<'+'/script>'; const html=document.documentElement.outerHTML.replace(/<script id="embedded-state" type="application\/json">[\s\S]*?<\/script>/,'<script id="embedded-state" type="application/json">'+snapshot+closeScript); const blob=new Blob(['<!doctype html>\\n'+html],{type:'text/html;charset=utf-8'}); const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='HR系统功能测试工作台-可编辑版.html';a.click();URL.revokeObjectURL(url);notice='已导出当前编辑内容。';render(); }
      render();
    })();
  </script>
</body>
</html>
