    const direct = node.getAttribute('data-id') || node.dataset.id;
    if (direct) return direct;
    return node.id.match(/(?:^|-)flowchart-([A-Z]\d?)(?:-|$)/)?.[1]
      || node.id.match(/^flowchart-([A-Z]\d?)-/)?.[1]
      || '';
  }

  function bindMermaidFlowNodes() {
    document.querySelectorAll('#recruitmentMermaid g.node').forEach(node => {
      const nodeId = resolveMermaidNodeId(node);
      if (!nodeId) return;
      node.dataset.flowNode = nodeId;
      node.setAttribute('role', 'button');
      node.setAttribute('tabindex', '0');
    });
    syncFlowInteractivity();
  }

  function openFlowTarget(nodeId) {
    if (!isFlowNodeEligible(nodeId)) {
      const owner = flowOwners[nodeId] || '其他角色';
      const viewName = activeView === 'business' ? '业务规范' : 'HR规范';
      showFlowToast(`该步骤由${owner}负责，当前${viewName}视图不提供跳转。`);
      return;
    }
    const targetId = flowTargets[activeView]?.[nodeId];
    const target = targetId ? document.getElementById(targetId) : null;
    if (!target) {
      showFlowToast('该步骤在当前视图中的内容待补充。');
      return;
    }
    if (target.dataset.audience && target.dataset.audience !== activeView) {
      showFlowToast('目标不属于当前视图，已停止跳转。');
      return;
    }
    if (searchInput.value) {
      searchInput.value = '';
      applyFilters();
    }
    target.classList.remove('is-collapsed');
    const toggle = target.querySelector(':scope > .module-head .module-toggle span:last-child');
    if (toggle) toggle.textContent = '收起';
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.body.classList.remove('nav-open');
  }

  async function renderRecruitmentFlow() {
    const wrap = document.getElementById('mermaidFlowWrap');
    const source = document.getElementById('recruitmentMermaid');
    const flowModule = document.getElementById('recruitment-flow');
    const restoreCollapsed = flowModule?.classList.contains('is-collapsed');
    if (!wrap || !source || !window.mermaid) {
      wrap?.classList.add('is-error');
      return;
    }
    if (restoreCollapsed) flowModule.classList.remove('is-collapsed');
    try {
      window.mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: 'base',
        flowchart: { htmlLabels: false, useMaxWidth: false, curve: 'basis', nodeSpacing: 28, rankSpacing: 38 },
        themeVariables: { fontFamily: 'Microsoft YaHei, PingFang SC, Arial, sans-serif', fontSize: '13px', lineColor: '#a7a0d8', edgeLabelBackground: '#ffffff' }
      });
      await window.mermaid.run({ nodes: [source] });
      wrap.classList.add('is-ready');
      bindMermaidFlowNodes();
    } catch (error) {
      wrap.classList.add('is-error');
    } finally {
      if (restoreCollapsed) flowModule.classList.add('is-collapsed');
    }
  }

  function moduleNavItem(module) {
    const number = module.querySelector('.module-num')?.textContent.trim() || '';
    const mark = number.includes('/') ? number.split('/').pop().trim() : number;
    return {
      id: module.id,
      mark: mark || '·',
      title: module.querySelector('.module-title h2')?.textContent.trim() || module.id
    };
  }

  function moduleSubNavItems(module) {
    const explicitTitles = [...module.querySelectorAll('[data-nav-item]')];
    const titles = explicitTitles.length ? explicitTitles : [...module.querySelectorAll('.panel-title, .feature-point-head h3')];
    return titles.map((title, index) => {
      if (!title.id) title.id = `${module.id}-topic-${index + 1}`;
      title.dataset.navAnchor = module.id;
      return { id: title.id, title: title.dataset.navLabel || title.textContent.trim(), moduleId: module.id };
    }).filter(item => item.title);
  }

  function setActiveNav(targetId) {
    const moduleId = document.getElementById(targetId)?.dataset.navAnchor || '';
    nav.querySelectorAll('a[data-target]').forEach(link => {
      link.classList.toggle('active', link.dataset.target === targetId || (moduleId && link.dataset.target === moduleId));
    });
  }

  function setSubNavExpanded(link, expanded) {
    if (!link?.dataset.hasSubnav) return;
    const sublist = link.nextElementSibling;
    if (!sublist?.classList.contains('nav-sublist')) return;
    link.setAttribute('aria-expanded', String(expanded));
    sublist.hidden = !expanded;
  }

  function openOnlySubNav(link) {
    nav.querySelectorAll('a[data-has-subnav="true"]').forEach(item => setSubNavExpanded(item, item === link));
  }

  function setupNavObserver() {
    navObserver?.disconnect();
    if (!('IntersectionObserver' in window)) return;
    const sections = [document.getElementById('recruitment-flow'), ...currentNavModules(), ...document.querySelectorAll('[data-nav-anchor]')].filter(section => section && !section.closest('.module')?.hidden);
    navObserver = new IntersectionObserver(entries => {
      const current = entries.filter(entry => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (current) setActiveNav(current.target.id);
    }, { rootMargin: '-20% 0px -65% 0px', threshold: [0, .1, .5] });
    sections.forEach(section => navObserver.observe(section));
  }

  function renderViewNav() {
    const group = document.createElement('div');
    group.className = 'nav-group';
    const label = document.createElement('div');
    label.className = 'nav-label';
    label.textContent = (viewButtons.find(button => button.dataset.view === activeView)?.textContent.trim() || '') + '目录';
    group.append(label);
    const items = [{ id: 'recruitment-flow', mark: '◆', title: '完整招聘框架' }, ...currentNavModules().map(moduleNavItem)];
    items.forEach((item, index) => {
      const link = document.createElement('a');
      link.href = '#' + item.id;
      link.dataset.target = item.id;
      link.classList.toggle('active', index === 0);
      const mark = document.createElement('span');
      mark.className = 'nav-mark';
      mark.textContent = item.mark;
      link.append(mark, document.createTextNode(item.title));
      group.append(link);
      if (item.id !== 'recruitment-flow') {
        const module = document.getElementById(item.id);
        const subItems = module ? moduleSubNavItems(module) : [];
        if (subItems.length) {
          link.dataset.hasSubnav = 'true';
          link.setAttribute('aria-expanded', 'false');
          const toggle = document.createElement('span');
          toggle.className = 'nav-subtoggle';
          toggle.setAttribute('role', 'button');
          toggle.tabIndex = 0;
          toggle.setAttribute('aria-label', `展开${item.title}二级目录`);
          toggle.textContent = '›';
          link.append(toggle);
          const sublist = document.createElement('div');
          sublist.className = 'nav-sublist';
          sublist.hidden = true;
          subItems.forEach(subItem => {
            const sublink = document.createElement('a');
            sublink.href = '#' + subItem.id;
            sublink.dataset.target = subItem.id;
            sublink.dataset.moduleTarget = subItem.moduleId;
            sublink.className = 'nav-subitem';
            sublink.textContent = subItem.title;
            sublist.append(sublink);
          });
          group.append(sublist);
        }
      }
    });
    nav.replaceChildren(group);
    setupNavObserver();
  }

  function clearHighlights() {
    document.querySelectorAll('mark.search-mark').forEach(mark => mark.replaceWith(document.createTextNode(mark.textContent)));
  }

  function highlight(root, query) {
    if (!query || !root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue.trim() || node.parentElement.closest('script,style,button,mark')) return NodeFilter.FILTER_REJECT;
        return node.nodeValue.toLowerCase().includes(query) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const text = node.nodeValue;
      const lower = text.toLowerCase();
      const fragment = document.createDocumentFragment();
      let cursor = 0;
      for (let index = lower.indexOf(query); index >= 0; index = lower.indexOf(query, cursor)) {
        fragment.append(text.slice(cursor, index));
        const mark = document.createElement('mark');
        mark.className = 'search-mark';
        mark.textContent = text.slice(index, index + query.length);
        fragment.append(mark);
        cursor = index + query.length;
      }
      fragment.append(text.slice(cursor));
      node.replaceWith(fragment);
    });
  }

  function syncToolbars(visibleModules) {
    const hasFields = activeView === 'function' && visibleModules.some(module => module.querySelector('tr[data-field-type]'));
    fieldToolbar.hidden = !hasFields;
    collapseToolbar.hidden = visibleModules.length < 2;
  }

  function syncViewSections(module) {
    module.querySelectorAll('[data-view-section]').forEach(section => {
      section.hidden = activeView !== 'all' && section.dataset.viewSection !== activeView;
    });
  }

  function applyFilters() {
    clearHighlights();
    const query = searchInput.value.trim().toLowerCase();
    const visibleModules = [];
    modules().forEach(module => {
      const audience = module.dataset.audience || 'all';
      const viewMatch = audience === activeView;
      const queryMatch = !query || module.textContent.toLowerCase().includes(query) || (module.dataset.keywords || '').toLowerCase().includes(query);
      module.hidden = !(viewMatch && queryMatch);
      syncViewSections(module);
      if (!module.hidden) {
        visibleModules.push(module);
        if (query) {
          module.classList.remove('is-collapsed');
          module.querySelectorAll('.feature-point').forEach(point => point.classList.remove('is-collapsed'));
          highlight(module, query);
        }
      }
    });
    const empty = document.getElementById('emptyState');
    empty.hidden = modules().length === 0 || visibleModules.length > 0;
    syncToolbars(visibleModules);
  }

  function setView(view, scrollToModules = false) {
    gifPlayers.forEach(player => player.pause());
    activeView = view;
    document.body.dataset.manualView = activeView;
    viewButtons.forEach(item => item.classList.toggle('active', item.dataset.view === activeView));
    applyFilters();
    renderViewNav();
    syncFlowInteractivity();
    if (scrollToModules) document.getElementById('recruitment-flow')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function prepareCollapsibles() {
    [document.getElementById('recruitment-flow'), ...modules()].filter(Boolean).forEach(module => {
      const head = module.querySelector(':scope > .module-head');
      if (!head || head.querySelector('.module-toggle')) return;
      const children = [...module.children].filter(child => child !== head);
      const body = document.createElement('div');
      body.className = 'module-collapse-body';
      children.forEach(child => body.append(child));
      module.append(body);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'module-toggle';
      const initiallyCollapsed = module.classList.contains('is-collapsed');
      button.innerHTML = `<span class="toggle-mark">▾</span><span>${initiallyCollapsed ? '展开流程' : '收起'}</span>`;
      button.setAttribute('aria-expanded', String(!initiallyCollapsed));
      button.addEventListener('click', () => {
        const collapsed = module.classList.toggle('is-collapsed');
        if (collapsed) module.querySelectorAll('.gif-player').forEach(root => [...gifPlayers].find(player => player.root === root)?.pause());
        button.lastElementChild.textContent = collapsed ? (module.id === 'recruitment-flow' ? '展开流程' : '展开') : '收起';
        button.setAttribute('aria-expanded', String(!collapsed));
      });
      head.append(button);
    });
    document.querySelectorAll('.feature-point').forEach(point => {
      const head = point.querySelector('.feature-point-head');
      if (!head || head.querySelector('.feature-point-toggle')) return;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'feature-point-toggle';
      button.innerHTML = '<span class="toggle-mark">▾</span><span>收起</span>';
      button.addEventListener('click', () => {
        const collapsed = point.classList.toggle('is-collapsed');
        button.lastElementChild.textContent = collapsed ? '展开' : '收起';
      });
      head.append(button);
    });
  }

  searchInput.addEventListener('input', applyFilters);
  document.getElementById('recruitment-flow')?.addEventListener('click', event => {
    const node = event.target.closest('[data-flow-node]');
    if (node) openFlowTarget(node.dataset.flowNode);
  });
  document.getElementById('recruitment-flow')?.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const node = event.target.closest('[data-flow-node]');
    if (!node) return;
    event.preventDefault();
    openFlowTarget(node.dataset.flowNode);
  });
  viewButtons.forEach(button => button.addEventListener('click', () => setView(button.dataset.view, true)));
  nav.addEventListener('click', event => {
    const subToggle = event.target.closest('.nav-subtoggle');
    if (subToggle) {
      event.preventDefault();
      event.stopPropagation();
      const parentLink = subToggle.closest('a[data-has-subnav="true"]');
      const shouldOpen = parentLink?.getAttribute('aria-expanded') !== 'true';
      if (shouldOpen) openOnlySubNav(parentLink);
      else setSubNavExpanded(parentLink, false);
      return;
    }
    const link = event.target.closest('a[data-target]');
    if (!link) return;
    event.preventDefault();
    const target = document.getElementById(link.dataset.target);
    if (!target) return;
    const targetModule = link.dataset.moduleTarget ? document.getElementById(link.dataset.moduleTarget) : target.closest('.module');
    if (link.dataset.hasSubnav === 'true') openOnlySubNav(link);
    if (target.hidden || targetModule?.hidden) {
      searchInput.value = '';
      applyFilters();
    }
    const expandableModule = target.id === 'recruitment-flow' ? target : targetModule;
    expandableModule?.classList.remove('is-collapsed');
    target.closest('.feature-point')?.classList.remove('is-collapsed');
    const toggle = expandableModule?.querySelector(':scope > .module-head .module-toggle span:last-child');
    if (toggle) toggle.textContent = '收起';
    setActiveNav(target.id);
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.body.classList.remove('nav-open');
  });
  nav.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const subToggle = event.target.closest('.nav-subtoggle');
    if (!subToggle) return;
    event.preventDefault();
    const parentLink = subToggle.closest('a[data-has-subnav="true"]');
    const shouldOpen = parentLink?.getAttribute('aria-expanded') !== 'true';
    if (shouldOpen) openOnlySubNav(parentLink);
    else setSubNavExpanded(parentLink, false);
  });
  fieldButtons.forEach(button => button.addEventListener('click', () => {
    const filter = button.dataset.fieldFilter;
    fieldButtons.forEach(item => item.classList.toggle('active', item === button));
    modulesRoot.querySelectorAll('tbody tr').forEach(row => {
      row.hidden = filter !== 'all' && row.dataset.fieldType !== filter;
    });
  }));
  document.querySelectorAll('[data-collapse-action]').forEach(button => button.addEventListener('click', () => {
    const close = button.dataset.collapseAction === 'close';
    modules().filter(module => !module.hidden).forEach(module => {
      module.classList.toggle('is-collapsed', close);
      if (close) module.querySelectorAll('.gif-player').forEach(root => [...gifPlayers].find(player => player.root === root)?.pause());
      const toggle = module.querySelector('.module-toggle span:last-child');
      if (toggle) toggle.textContent = close ? '展开' : '收起';
      module.querySelectorAll('.feature-point').forEach(point => point.classList.toggle('is-collapsed', close));
    });
  }));
  sidebarToggle?.addEventListener('click', () => {
    const collapsed = document.body.classList.toggle('nav-collapsed');
    sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
  });
  document.getElementById('printBtn')?.addEventListener('click', () => window.print());
  document.getElementById('mobileNavToggle')?.addEventListener('click', () => {
    document.body.classList.add('nav-open');
  });
  backdrop?.addEventListener('click', () => {
    document.body.classList.remove('nav-open');
  });
  window.addEventListener('scroll', () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    progress.style.transform = 'scaleX(' + (max > 0 ? scrollY / max : 0) + ')';
  }, { passive: true });
  document.addEventListener('click', event => {
    const trigger = event.target.closest('[data-zoom]');
    if (!trigger) return;
    closeGifLightbox();
    const image = document.getElementById('lightboxImg');
    image.src = trigger.dataset.zoom || trigger.src || '';
    document.getElementById('lightbox').classList.add('open');
  });
  document.getElementById('closeLightbox')?.addEventListener('click', () => { closeGifLightbox(); document.getElementById('lightbox').classList.remove('open'); });
  document.getElementById('lightbox')?.addEventListener('click', event => {
    if (event.target.id === 'lightbox') { closeGifLightbox(); event.currentTarget.classList.remove('open'); }
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      closeGifLightbox();
      document.getElementById('lightbox')?.classList.remove('open');
      document.body.classList.remove('nav-open');
    }
  });
  syncModuleMapStatus();
  addOperationFieldGuides();
  initializeGifPlayers();
  prepareCollapsibles();
  setView(activeView);
  renderRecruitmentFlow();
})();
</script>
</body>
</html>
