        <section class="module" id="biz-interview" data-audience="business" data-keywords="结构化面试 候选人体验 事实追问 能力验证"><div class="module-head"><div class="module-title"><span class="module-num">业务 / 03</span><h2>结构化面试</h2></div><div class="module-meta"><span class="tag purple">核心职责</span></div></div><p class="module-lead">业务负责人围绕岗位标准开展结构化面试，用一致、清晰、尊重的方式验证候选人的真实经历与能力，同时保障良好的候选人体验。</p><div class="panel"><div class="panel-title">建议面试结构</div><div class="panel-body"><ol class="steps"><li><div><b>清晰开场</b><span>准时参会，完成自我介绍，说明本轮面试的目标和大致安排，让候选人知道接下来会发生什么。</span></div></li><li><div><b>围绕事实追问</b><span>结合岗位要求询问候选人做过什么、承担什么角色、如何行动、产生什么结果，并通过追问确认其实际贡献。</span></div></li><li><div><b>按统一标准判断</b><span>对同一岗位使用相对一致的核心问题和判断维度，区分“候选人表达”与“已经验证的事实”。</span></div></li><li><div><b>留出候选人提问时间</b><span>如实回答岗位和团队相关问题；不确定的信息不随意承诺，面试后可交由 HR 补充。</span></div></li><li><div><b>规范收尾</b><span>感谢候选人参与，不在现场随意承诺录用结果、薪资或后续时间，由 HR 统一跟进。</span></div></li></ol></div></div><div class="rule-box"><strong>业务重点：</strong>AI 面试、会议链接和日程同步等系统事务不作为业务负责人操作重点。业务负责人重点做好候选人了解、专业面试和客观评价。</div></section>
        <section class="module" id="biz-evaluate" data-audience="business" data-keywords="提交评价 写面评 事实依据 优势 风险 结论"><div class="module-head"><div class="module-title"><span class="module-num">业务 / 04</span><h2>提交评价</h2></div><div class="module-meta"><span class="tag purple">核心职责</span><span class="tag green">界面已核验</span></div></div><p class="module-lead">面试结束后及时进入候选人页面撰写面评。评价必须能够让未参加面试的 HR 看懂判断依据，并支持后续决策与沟通。</p><div class="panel"><div class="panel-title">规范评价的四个部分</div><div class="panel-body"><ol class="steps"><li><div><b>事实记录</b><span>记录候选人的关键回答、经历和可验证结果，避免只写“感觉不错”“沟通一般”等模糊印象。</span></div></li><li><div><b>岗位匹配判断</b><span>逐项说明哪些能力符合岗位要求、证据是什么，区分已经验证与尚未验证的内容。</span></div></li><li><div><b>优势与风险</b><span>写明值得继续关注的优势、可能影响胜任的风险及建议在下一轮补充验证的问题。</span></div></li><li><div><b>明确结论</b><span>给出清晰建议，并确保结论与前述事实、能力判断和风险分析一致。</span></div></li></ol></div></div><div class="panel gif-panel"><div class="panel-title">面试评价完整操作</div><img loading="lazy" decoding="async" src="business-assets/interview-evaluation.gif" alt="面试评价操作：从钉钉面试通知进入候选人页面，填写并保存面试评价" data-zoom="business-assets/interview-evaluation.gif"><div class="gif-note">钉钉面试通知点击候选人链接 → 在候选人面试阶段点击“写面评” → 选择面试结论并填写评价 → 保存成功。候选人简历统一使用中性白色占位展示。</div></div><div class="panel field-panel"><div class="panel-title">评价内容规范</div><div class="panel-body table-scroll"><table class="standard-table"><thead><tr><th>评价部分</th><th>应该写什么</th><th>避免写什么</th><th>完成标准</th><th>系统字段</th></tr></thead><tbody><tr data-field-type="required"><td>事实依据</td><td>具体回答、行为、职责和结果</td><td>仅写主观感觉</td><td>他人能够理解判断从何而来</td><td>面试评价</td></tr><tr data-field-type="required"><td>能力判断</td><td>与岗位要求对应的匹配情况</td><td>与岗位无关的个人评价</td><td>判断与证据一一对应</td><td>面试评价</td></tr><tr data-field-type="required"><td>风险与待验证项</td><td>风险表现、影响及后续验证建议</td><td>没有事实依据的标签</td><td>HR 或下一轮面试官可直接继续验证</td><td>面试评价</td></tr><tr data-field-type="required"><td>面试结论</td><td>明确的推进建议</td><td>模糊、矛盾或无结论</td><td>结论与正文判断保持一致</td><td>面试结论</td></tr></tbody></table></div></div><div class="rule-box"><strong>已核验：</strong>“写面试评价”面板包含必填的“面试结论”和“面试评价”；结论选项为“面试通过”“面试不通过”，操作按钮为“取消”“保存”。</div><div class="evidence-line">证据来源：用户提供的钉钉面试通知，以及新 HR 系统面试阶段、写面试评价面板、填写状态和保存成功截图。</div></section>
        <section class="module" id="biz-handoff" data-audience="business" data-keywords="反馈与交接 HR协作 异常 候选人体验"><div class="module-head"><div class="module-title"><span class="module-num">业务 / 05</span><h2>反馈与交接</h2></div><div class="module-meta"><span class="tag purple">协作闭环</span></div></div><p class="module-lead">业务负责人完成评价后，将判断和必要信息完整交给 HR；HR 负责招聘阶段和候选人后续沟通，双方共同保障流程顺畅与候选人体验。</p><div class="module-grid"><div class="panel"><div class="panel-title">业务负责人需要完成</div><div class="panel-body"><ul class="checklist"><li>在约定时间内完成作品评价或面试评价，不让后续流程因反馈缺失而停滞。</li><li>评价内容有事实、有岗位判断、有风险说明、有明确结论。</li><li>出现迟到、缺席、时间冲突、沟通异常或需要补充验证的情况，及时同步 HR。</li><li>对候选人提出但现场无法确认的问题，记录并交由 HR 后续回复。</li></ul></div></div><div class="panel"><div class="panel-title">HR 接续处理</div><div class="panel-body"><ul class="checklist"><li>结合评价决定后续招聘流程并完成系统操作。</li><li>负责候选人阶段推进、回退、终止及后续通知。</li><li>协调下一轮面试或补充沟通，并向相关人员同步必要信息。</li><li>具体时效与异常升级规则待内部规范确认。</li></ul></div></div></div><div class="rule-box"><strong>候选人体验底线：</strong>业务人员不向候选人随意承诺结果或时间；对外口径由 HR 统一协调，但业务人员应及时、完整地提供判断依据。</div><div class="evidence-line">证据来源：已核验候选人投递详情页中的评价入口和 HR 阶段操作入口；协作时效、异常升级和对外口径仍需业务制度确认。</div></section></div>

        <template id="featurePointComponentTemplate"><div class="feature-point"><div class="feature-point-head"><h3>功能点标题待确认</h3><span class="tag purple">证据待采集</span></div><div class="feature-point-body"><div class="media-pair"><div class="media-placeholder">操作前截图待采集</div><div class="media-placeholder">操作后截图或动态演示待采集</div></div><div class="evidence-line">证据来源、页面路径、角色、系统版本和核验时间待填写。</div><div data-view-section="hr"><div class="rule-box"><strong>HR 操作规范：</strong>责任人、操作时点、完成标准和异常处理待核验。</div></div><div data-view-section="business"><div class="rule-box"><strong>业务协作规范：</strong>协作角色、输入信息、反馈动作和完成标准待核验。</div></div></div></div></template>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="放大查看截图"><button id="closeLightbox" aria-label="关闭">×</button><img id="lightboxImg" src="" alt="放大图片"></div>

<script>
(() => {
  const modulesRoot = document.getElementById('modules');
  const searchInput = document.getElementById('searchInput');
  const viewButtons = [...document.querySelectorAll('[data-view]')];
  const fieldButtons = [...document.querySelectorAll('[data-field-filter]')];
  const sidebar = document.querySelector('.sidebar');
  const backdrop = document.getElementById('navBackdrop');
  const progress = document.getElementById('progress');
  const fieldToolbar = document.getElementById('fieldToolbar');
  const collapseToolbar = document.getElementById('collapseToolbar');
  const sidebarToggle = document.getElementById('sidebarToggle');
  let activeView = 'function';
  const modules = () => [...modulesRoot.querySelectorAll('.module')];

  function clearHighlights() {
    document.querySelectorAll('mark.search-mark').forEach(mark => mark.replaceWith(document.createTextNode(mark.textContent)));
  }

  function highlight(root, query) {
    if (!query || !root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (!node.nodeValue.trim() || node.parentElement.closest('script,style,button,mark')) return NodeFilter.FILTER_REJECT;
        return node.nodeValue.toLowerCase().includes(query) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const text = node.nodeValue;
      const lower = text.toLowerCase();
      const fragment = document.createDocumentFragment();
      let cursor = 0;
      for (let index = lower.indexOf(query); index >= 0; index = lower.indexOf(query, cursor)) {
        fragment.append(text.slice(cursor, index));
        const mark = document.createElement('mark');
        mark.className = 'search-mark';
        mark.textContent = text.slice(index, index + query.length);
        fragment.append(mark);
        cursor = index + query.length;
      }
      fragment.append(text.slice(cursor));
      node.replaceWith(fragment);
    });
  }

  function syncToolbars(visibleModules) {
    const hasFields = visibleModules.some(module => module.querySelector('.standard-table'));
    fieldToolbar.hidden = !hasFields;
    collapseToolbar.hidden = visibleModules.length === 0;
  }

  function syncViewSections(module) {
    module.querySelectorAll('[data-view-section]').forEach(section => {
      section.hidden = activeView !== 'all' && section.dataset.viewSection !== activeView;
    });
  }

  function applyFilters() {
    clearHighlights();
    const query = searchInput.value.trim().toLowerCase();
    const visibleModules = [];
    modules().forEach(module => {
      const audience = module.dataset.audience || 'all';
      const hasViewSections = !!module.querySelector('[data-view-section]');
      const viewMatch = hasViewSections || activeView === 'all' || audience === activeView;
      const queryMatch = !query || module.textContent.toLowerCase().includes(query) || (module.dataset.keywords || '').toLowerCase().includes(query);
      module.hidden = !(viewMatch && queryMatch);
      syncViewSections(module);
      if (!module.hidden) {
        visibleModules.push(module);
        if (query) {
          module.classList.remove('is-collapsed');
          module.querySelectorAll('.feature-point').forEach(point => point.classList.remove('is-collapsed'));
          highlight(module, query);
        }
      }
    });
    const empty = document.getElementById('emptyState');
    empty.hidden = modules().length === 0 || visibleModules.length > 0;
    syncToolbars(visibleModules);
  }

  function setView(view, scrollToModules = false) {
    activeView = view;
    viewButtons.forEach(item => item.classList.toggle('active', item.dataset.view === activeView));
    applyFilters();
    if (scrollToModules) modulesRoot.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function prepareCollapsibles() {
    modules().forEach(module => {
      const head = module.querySelector(':scope > .module-head');
      if (!head || head.querySelector('.module-toggle')) return;
      const children = [...module.children].filter(child => child !== head);
      const body = document.createElement('div');
      body.className = 'module-collapse-body';
      children.forEach(child => body.append(child));
      module.append(body);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'module-toggle';
      button.innerHTML = '<span class="toggle-mark">▾</span><span>收起</span>';
      button.addEventListener('click', () => {
        const collapsed = module.classList.toggle('is-collapsed');
        button.lastElementChild.textContent = collapsed ? '展开' : '收起';
        button.setAttribute('aria-expanded', String(!collapsed));
      });
      head.append(button);
    });
    document.querySelectorAll('.feature-point').forEach(point => {
      const head = point.querySelector('.feature-point-head');
      if (!head || head.querySelector('.feature-point-toggle')) return;
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'feature-point-toggle';
      button.innerHTML = '<span class="toggle-mark">▾</span><span>收起</span>';
      button.addEventListener('click', () => {
        const collapsed = point.classList.toggle('is-collapsed');
        button.lastElementChild.textContent = collapsed ? '展开' : '收起';
      });
      head.append(button);
    });
  }

  searchInput.addEventListener('input', applyFilters);
  viewButtons.forEach(button => button.addEventListener('click', () => setView(button.dataset.view, true)));
  document.querySelectorAll('[data-open-view]').forEach(link => link.addEventListener('click', () => {
    setView(link.dataset.openView);
  }));
  fieldButtons.forEach(button => button.addEventListener('click', () => {
    const filter = button.dataset.fieldFilter;
    fieldButtons.forEach(item => item.classList.toggle('active', item === button));
    modulesRoot.querySelectorAll('tbody tr').forEach(row => {
      row.hidden = filter !== 'all' && row.dataset.fieldType !== filter;
    });
  }));
  document.querySelectorAll('[data-collapse-action]').forEach(button => button.addEventListener('click', () => {
    const close = button.dataset.collapseAction === 'close';
    modules().filter(module => !module.hidden).forEach(module => {
      module.classList.toggle('is-collapsed', close);
      const toggle = module.querySelector('.module-toggle span:last-child');
      if (toggle) toggle.textContent = close ? '展开' : '收起';
      module.querySelectorAll('.feature-point').forEach(point => point.classList.toggle('is-collapsed', close));
    });
  }));
  sidebarToggle?.addEventListener('click', () => {
    const collapsed = document.body.classList.toggle('nav-collapsed');
    sidebarToggle.setAttribute('aria-expanded', String(!collapsed));
  });
  document.getElementById('printBtn')?.addEventListener('click', () => window.print());
  document.getElementById('mobileNavToggle')?.addEventListener('click', () => {
    document.body.classList.add('nav-open');
  });
  backdrop?.addEventListener('click', () => {
    document.body.classList.remove('nav-open');
  });
  document.querySelectorAll('.nav a[href^="#"]').forEach(link => link.addEventListener('click', () => {
    document.body.classList.remove('nav-open');
  }));
  window.addEventListener('scroll', () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    progress.style.transform = 'scaleX(' + (max > 0 ? scrollY / max : 0) + ')';
  }, { passive: true });
  document.addEventListener('click', event => {
    const trigger = event.target.closest('[data-zoom]');
    if (!trigger) return;
    const image = document.getElementById('lightboxImg');
    image.src = trigger.dataset.zoom || trigger.src || '';
    document.getElementById('lightbox').classList.add('open');
  });
  document.getElementById('closeLightbox')?.addEventListener('click', () => document.getElementById('lightbox').classList.remove('open'));
  document.getElementById('lightbox')?.addEventListener('click', event => {
    if (event.target.id === 'lightbox') event.currentTarget.classList.remove('open');
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      document.getElementById('lightbox')?.classList.remove('open');
      document.body.classList.remove('nav-open');
    }
  });
  const observedSections = [...document.querySelectorAll('#home,#overview,#recruitment-flow,#principles,#modules > .module')];
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver(entries => {
      const current = entries.filter(entry => entry.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (!current) return;
      document.querySelectorAll('.nav a[data-target]').forEach(link => link.classList.toggle('active', link.dataset.target === current.target.id));
    }, { rootMargin: '-20% 0px -65% 0px', threshold: [0,.1,.5] });
    observedSections.forEach(section => observer.observe(section));
  }
  prepareCollapsibles();
  applyFilters();
})();
</script>
